    # VesperTV pairing relay (Add Playlist > From phone) — tools/pair_relay/.
    # Its own name, certificate and block: nothing shared with the stream hosts.
    limit_req_zone $binary_remote_addr zone=pair:1m rate=5r/s;

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pair.vespertv.app;

        ssl_certificate     /etc/letsencrypt/live/pair.vespertv.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pair.vespertv.app/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # URLs carry session ids; bodies are ciphertext — log neither.
        access_log off;
        client_max_body_size 8k;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            limit_req zone=pair burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8930;
            proxy_set_header Host $host;
            proxy_read_timeout 15s;
        }
    }
