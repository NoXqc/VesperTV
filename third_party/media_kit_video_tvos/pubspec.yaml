name: media_kit_video_tvos
description: Apple TV video output for package:media_kit (VesperTV's port of media_kit_video's iOS code).
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      tvos:
        pluginClass: MediaKitVideoPlugin
