# Tests on every pull request and on main: the Flutter suite and the
# vendored Android player's native tests. Nothing is built or published.
#
# `flutter analyze --no-fatal-infos`: the project keeps a baseline of info
# issues (CLAUDE.md §4); warnings and errors still fail the check.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  native:
    # third_party/video_player_android (ExoPlayer patches), Robolectric.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      # android/gradlew is git-ignored: let Flutter generate the wrapper.
      - run: flutter build apk --config-only
      - name: Native player tests
        working-directory: android
        run: ./gradlew :video_player_android:testDebugUnitTest
