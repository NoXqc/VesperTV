# macOS build: an unsigned VesperTV.app, zipped, plus a plain DMG, as workflow artifacts.
# Lets the project produce Mac builds without owning a Mac.
#
# With "release_tag" the DMG is also attached to that release as
# VesperTV-macos.dmg (every Sunday release since 1.0.73: dev-notes/release.md
# step 4b); the Mac app's Check for Updates opens it. The ZIP stays an
# artifact on purpose: Windows builds older than the per-platform asset
# picker (AppUpdateService.pickAsset) take the first ".zip" on the latest
# release, so attaching it could offer a Mac app to a PC. A ".dmg" is safe.
# Unsigned / not notarized: after the first blocked launch, macOS needs
# System Settings > Privacy & Security > Open Anyway (dev-notes/macos-desktop.md).
name: macOS build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the DMG to this release (its tag must be the commit built); empty = artifact only
        type: string
        default: ''
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Build macOS (release, unsigned)
        # CocoaPods is preinstalled on the runner; flutter runs pod install.
        run: flutter build macos --release 2>&1 | tee build-macos.log; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          LANG: en_US.UTF-8
      - name: Zip VesperTV.app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent VesperTV.app "$GITHUB_WORKSPACE/VesperTV-macos.zip"
      - name: Make the DMG
        # Plain drag-to-Applications layout. The styled black + gold one
        # (tools/macos_dmg/build.sh) lays its window out through Finder, which
        # needs a GUI session the runner doesn't have: build that one on a Mac.
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          mkdir -p dmg-src
          ditto build/macos/Build/Products/Release/VesperTV.app dmg-src/VesperTV.app
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname "VesperTV $version" -srcfolder dmg-src \
            -format UDZO -ov "VesperTV-$version-macos.dmg"
          hdiutil verify "VesperTV-$version-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: VesperTV-macos
          path: VesperTV-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VesperTV-macos-dmg
          path: VesperTV-*-macos.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-macos-log
          path: build-macos.log

  attach:
    name: Attach to the release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VesperTV-macos-dmg
          path: dl
      - name: Upload VesperTV-macos.dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          # Only the build of the release's own commit goes on it.
          tag_sha="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG is $tag_sha but this run built $GITHUB_SHA"; exit 1
          fi
          f="$(find dl -name '*-macos.dmg' -type f | head -1)"
          if [ -z "$f" ]; then echo "No .dmg in the artifact"; find dl; exit 1; fi
          # One name for every release, so releases/latest/download/... links keep working.
          cp "$f" VesperTV-macos.dmg
          ls -l VesperTV-macos.dmg
          gh release upload "$TAG" VesperTV-macos.dmg --clobber --repo "$REPO"
          # Older versioned DMGs on this release go.
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -- '-macos\.dmg$' | grep -vx 'VesperTV-macos.dmg' \
            | while read -r a; do gh release delete-asset "$TAG" "$a" --yes --repo "$REPO"; done
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"'
