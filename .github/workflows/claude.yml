# "@claude ..." in an issue or pull request comment: Claude works on it
# (a fix on a new claude/... branch with a pull request, or an answer).
# Only the repository owner can start it. Nothing is merged or released:
# the owner reviews the pull request and tests the build on a box first.
#
# Needs the Claude GitHub app on this repository (github.com/apps/claude)
# and the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # So Claude can run the analyzer and the tests on its change.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `prompt`: that would switch the action from answering the
          # comment to a fixed task. House rules go in as extra instructions.
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --allowedTools "Bash(flutter analyze:*),Bash(flutter test:*),Bash(dart format:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr view:*)"
            --append-system-prompt "Follow the repository's CLAUDE.md. It is long: Grep it for the area you touch, and read section 10 before changing UI or focus code. Files are CRLF. Only run dart format on files you changed. flutter analyze must stay at the 16-info baseline and flutter test must pass. A LOG- code in the issue is a user's Send log the developer can read on his PC; it is not in this run. Never change signing, release or secret files, and never bump the version in pubspec.yaml."
