# Linux desktop build: VesperTV as a .tar.gz of Flutter's release bundle, as a
# workflow artifact. Same media_kit (mpv) player as Windows/macOS.
#
# Built on Ubuntu 24.04, so it needs a distro at least that new (glibc 2.39)
# plus the system libmpv (Ubuntu/Mint: sudo apt install libmpv2). With
# "release_tag" it is also attached to that release as VesperTV-linux-x64.tar.gz
# (release step in dev-notes/release.md; since 1.0.72). AppUpdateService
# offers nothing on Linux.
name: Linux build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the .tar.gz to this release (its tag must be the commit built); empty = artifact only
        type: string
        default: ''
  push:
    branches: [main, claude/linux-build]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools + libmpv
        run: |
          # A slow mirror hung this step for 45+ min (2026-11-18): time out
          # and retry instead of waiting for the job's 60 min limit.
          apt="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 600 sudo apt-get $apt update
          timeout 900 sudo apt-get $apt install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Build Linux (release)
        run: flutter build linux --release 2>&1 | tee build-linux.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Package
        # The binary needs its lib/ and data/ folders beside it: ship the
        # whole bundle (like the Windows zip).
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          name="VesperTV-${version/+/-}-linux-x64"
          cp -R build/linux/x64/release/bundle "$name"
          tar -czf "$name.tar.gz" "$name"
          ls -l "$name.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: VesperTV-linux
          path: VesperTV-*-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-linux-log
          path: build-linux.log

  release:
    name: Attach to the release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VesperTV-linux
          path: dl
      - name: Upload VesperTV-linux-x64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          # Only the build of the release's own commit goes on it.
          tag_sha="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG is $tag_sha but this run built $GITHUB_SHA"; exit 1
          fi
          f="$(find dl -name '*-linux-x64.tar.gz' -type f | head -1)"
          if [ -z "$f" ]; then echo "No .tar.gz in the artifact"; find dl; exit 1; fi
          # One name for every release, so releases/latest/download/... links keep working.
          cp "$f" VesperTV-linux-x64.tar.gz
          ls -l VesperTV-linux-x64.tar.gz
          gh release upload "$TAG" VesperTV-linux-x64.tar.gz --clobber --repo "$REPO"
          # Older versioned tarballs on this release go.
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -- '-linux-x64\.tar\.gz$' | grep -vx 'VesperTV-linux-x64.tar.gz' \
            | while read -r a; do gh release delete-asset "$TAG" "$a" --yes --repo "$REPO"; done
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"'
