# VesperTV as a Flatpak (app.vespertv.VesperTV): one .flatpak file that installs on
# any distro with Flatpak (Discover on SteamOS, no distrobox), with its own libmpv +
# FFmpeg (VA-API). A workflow artifact for now, not a release asset.
# Manifest + notes: linux/flatpak/, dev-notes/linux.md (Flatpak).
name: Linux Flatpak

on:
  workflow_dispatch:
  push:
    branches: [claude/linux-flatpak]

jobs:
  bundle:
    name: Flutter bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools + libmpv headers
        run: |
          # libmpv-dev only to compile media_kit's plugin; the Flatpak brings
          # its own libmpv.so.2. Time out and retry on a slow mirror.
          apt="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 600 sudo apt-get $apt update
          timeout 900 sudo apt-get $apt install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Flatpak application id
        # The tarball keeps com.nox.nox_iptv (its settings folder is named after
        # it). Inside the Flatpak the window must carry the Flatpak's id, or a
        # Wayland desktop shows no icon / name for it.
        run: |
          sed -i 's/^set(APPLICATION_ID "com.nox.nox_iptv")/set(APPLICATION_ID "app.vespertv.VesperTV")/' linux/CMakeLists.txt
          grep -n 'APPLICATION_ID "app.vespertv.VesperTV"' linux/CMakeLists.txt
      - name: Build Linux (release)
        run: flutter build linux --release 2>&1 | tee build-linux.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Bundle
        id: bundle
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "version=${version/+/-}" >> "$GITHUB_OUTPUT"
          tar -C build/linux/x64/release -czf vespertv-bundle.tar.gz bundle
          ls -l vespertv-bundle.tar.gz
          # What the runtime has to provide (libmpv comes from the manifest).
          for f in build/linux/x64/release/bundle/vespertv build/linux/x64/release/bundle/lib/*.so; do
            echo "== ${f##*/}: $(readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tr '\n' ' ')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-bundle
          path: vespertv-bundle.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-linux-log
          path: build-linux.log

  flatpak:
    name: Flatpak
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-bundle
          path: linux/flatpak
      - name: Writable Flatpak installation
        # The image's runtimes sit in a lower overlayfs layer: updating one
        # renames directories across layers and fails ("Failed to update
        # org.gnome.Sdk: Invalid cross-device link", run 44816465001, after a
        # GNOME 51 SDK update). A copy lives in the container's own layer.
        run: |
          df -h /var/lib | tail -1
          for d in /var/lib/flatpak /root/.local/share/flatpak; do
            [ -d "$d" ] || continue
            cp -a "$d" "$d.rw" && rm -rf "$d" && mv "$d.rw" "$d"
          done
          df -h /var/lib | tail -1
          flatpak list --columns=application,branch
      - name: Release in the metainfo
        run: |
          v="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          sed -i "s/@VERSION@/$v/; s/@DATE@/$(date -u +%F)/" linux/flatpak/app.vespertv.VesperTV.metainfo.xml
          grep -n '<release ' linux/flatpak/app.vespertv.VesperTV.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          # The artifact gets "-x86_64" added.
          bundle: VesperTV-${{ needs.bundle.outputs.version }}.flatpak
          manifest-path: linux/flatpak/app.vespertv.VesperTV.yml
          cache-key: flatpak-builder-${{ hashFiles('linux/flatpak/app.vespertv.VesperTV.yml') }}
      - name: Smoke test (install the bundle, libraries, 20 s run under Xvfb)
        run: |
          b="$(find . -maxdepth 2 -name 'VesperTV-*.flatpak' | head -1)"
          echo "bundle: $b"
          flatpak install -y --noninteractive --system "$b"
          # Everything the app and libmpv load must come from /app or the runtime.
          # Plugins find libflutter_linux_gtk.so through the binary (already
          # loaded), hence LD_LIBRARY_PATH; libdartjni.so is package:jni's Android
          # bridge (wants libjvm.so) and is never loaded on Linux.
          flatpak run --command=sh app.vespertv.VesperTV -c '
            for f in /app/vespertv/vespertv /app/vespertv/lib/*.so /app/lib/libmpv.so.2; do
              [ "${f##*/}" = libdartjni.so ] && continue
              LD_LIBRARY_PATH=/app/vespertv/lib ldd "$f" 2>/dev/null | grep "not found" | sed "s|^|MISSING ($f): |"
            done
            echo "libraries checked"' | tee ldd.txt
          if grep -q MISSING ldd.txt; then exit 1; fi
          set +e
          timeout 20 xvfb-run -a flatpak run app.vespertv.VesperTV > run.log 2>&1
          code=$?
          set -e
          tail -60 run.log
          echo "exit $code (124 = still running after 20 s = started fine)"
          [ "$code" = 124 ]
