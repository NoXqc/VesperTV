# Apple TV build (dev-notes/apple-tv.md).
#
# Flutter has no tvOS support; the community flutter-tvos engine and CLI
# (github.com/fluttertv/flutter-tvos) do, pinned below to the release that
# tracks the Flutter version the iPhone build uses. The CLI fetches its own
# pinned Flutter SDK, so no flutter-action here.
#
# What it does:
# - Builds libmpv for Apple TV (tools/tvos/build_mpv_framework.sh, cached)
#   for the media_kit video plugin (third_party/media_kit_video_tvos).
# - Builds the app for the Apple TV simulator and runs it there: screenshots
#   and the app's log come back as the "tvos-test" artifact.
# - Player smoke test: lib/tvos_player_smoke.dart plays an HLS, a raw .ts and
#   an MKV sample through media_kit on the simulator (screenshots + log).
# - Compiles a release (AOT) device build without signing, to catch what
#   only breaks there. Not installable; TestFlight comes later.
name: tvOS build

on:
  workflow_dispatch:
  push:
    branches: [claude/tvos-test]

env:
  FLUTTER_TVOS_TAG: v3.47.9-tvos.1.11.5
  MPV_FRAMEWORKS: third_party/media_kit_video_tvos/tvos/Frameworks

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out

      - name: Install flutter-tvos
        run: |
          git clone --depth 1 --branch "$FLUTTER_TVOS_TAG" \
            https://github.com/fluttertv/flutter-tvos.git "$RUNNER_TEMP/flutter-tvos"
          echo "$RUNNER_TEMP/flutter-tvos/bin" >> "$GITHUB_PATH"
      - run: flutter-tvos precache
      - run: xcodebuild -version

      - name: Cache Apple TV libmpv
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MPV_FRAMEWORKS }}/Mpv.xcframework
          key: tvos-mpv-${{ hashFiles('tools/tvos/build_mpv_framework.sh') }}
      - name: Build Apple TV libmpv (Mpv.xcframework)
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$MPV_FRAMEWORKS"
          bash tools/tvos/build_mpv_framework.sh "$MPV_FRAMEWORKS" 2>&1 | tee out/mpv-build.log
          rm -rf "$MPV_FRAMEWORKS/.downloads"

      - name: Generate tvos/ when missing
        shell: bash
        run: |
          if [ ! -d tvos ]; then
            # In an existing project this runs Flutter's own create (which
            # keeps every file that exists) and adds tvos/ beside ios/.
            flutter-tvos create --org com.nox . 2>&1 | tee out/create.log
            tar -czf out/tvos-project.tgz tvos
          fi

      # wakelock_plus 1.8+ declares `tvos:` but keeps its tvOS code in ios/;
      # flutter-tvos only builds a plugin's tvos/ folder, so the registrant
      # imported a module that was never built ("Module 'wakelock_plus' not
      # found"). Apple TV uses the fluttertv.dev port (wakelock_plus_tvos)
      # instead: drop upstream's tvOS entry in this runner's pub cache only.
      - name: Use wakelock_plus_tvos, not upstream's tvOS entry
        shell: bash
        run: |
          flutter-tvos pub get
          for f in ~/.pub-cache/hosted/pub.dev/wakelock_plus-*/pubspec.yaml; do
            python3 - "$f" <<'EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          t = re.sub(r"\n      tvos:\n        pluginClass: WakelockPlusPlugin", "", s)
          open(p, "w").write(t)
          print(p, "patched" if t != s else "unchanged")
          EOF
          done

      - name: Build the app for the Apple TV simulator
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          rc=0
          flutter-tvos build tvos --simulator --debug -v > out/build-simulator.log 2>&1 || rc=$?
          grep -E "error:|Mpv|Built |BUILD" out/build-simulator.log | tail -40
          exit $rc

      - name: Run the app on the Apple TV simulator
        run: bash tools/tvos/sim_run.sh app 15 45 90

      - name: Build the player smoke test
        if: always()
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -o pipefail
          flutter-tvos build tvos --simulator --debug -t lib/tvos_player_smoke.dart 2>&1 | tee out/build-smoke.log | tail -5

      - name: Run the player smoke test (HLS, .ts, MKV)
        if: always()
        run: bash tools/tvos/sim_run.sh smoke 12 20 37 45 62 70 80

      - name: Release device build (unsigned compile check)
        if: always()
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -o pipefail
          flutter-tvos build tvos --release --no-codesign 2>&1 | tee out/build-release.log | tail -5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvos-test
          path: out/
