# Apple TV test build (dev-notes/apple-tv.md, step 3 of the Apple TV plan).
#
# Flutter has no tvOS support; the community flutter-tvos engine and CLI
# (github.com/fluttertv/flutter-tvos) do, pinned below to the release that
# tracks the Flutter version the iPhone build uses. The CLI fetches its own
# pinned Flutter SDK, so no flutter-action here.
#
# What it does:
# - Generates tvos/ (the Apple TV Xcode project) when the branch has none
#   yet, and uploads it so it can be committed after a look.
# - Builds for the Apple TV simulator and runs it there: screenshots and the
#   app's console log come back as workflow artifacts.
# - Compiles a release (AOT) device build without signing, to catch what
#   only breaks there. Not installable; TestFlight comes later.
name: tvOS build

on:
  workflow_dispatch:
  push:
    branches: [claude/tvos-test]

env:
  FLUTTER_TVOS_TAG: v3.47.9-tvos.1.11.5

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install flutter-tvos
        run: |
          git clone --depth 1 --branch "$FLUTTER_TVOS_TAG" \
            https://github.com/fluttertv/flutter-tvos.git "$RUNNER_TEMP/flutter-tvos"
          echo "$RUNNER_TEMP/flutter-tvos/bin" >> "$GITHUB_PATH"
      - run: flutter-tvos precache
      - run: flutter-tvos doctor -v
        continue-on-error: true
      - run: xcodebuild -version && xcrun simctl list runtimes

      - name: Generate tvos/ when missing
        shell: bash
        run: |
          mkdir -p out
          if [ ! -d tvos ]; then
            # In an existing project this runs Flutter's own create (which
            # keeps every file that exists) and adds tvos/ beside ios/.
            # Same org as the iPhone app, so the bundle id matches.
            flutter-tvos create --org com.nox . 2>&1 | tee out/create.log
          fi
          git status --short > out/git-status-after-create.txt
          cat out/git-status-after-create.txt
          tar -czf out/tvos-project.tgz tvos

      - name: Build for the Apple TV simulator
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -o pipefail
          flutter-tvos build tvos --simulator --debug -v 2>&1 | tee out/build-simulator.log

      - name: Run on the Apple TV simulator
        shell: bash
        run: |
          set -x
          app="$(find build/tvos -type d -name '*.app' -path '*appletvsimulator*' | head -1)"
          [ -n "$app" ] || { echo "No simulator .app found"; find build -maxdepth 4 -type d; exit 1; }
          bundle="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          echo "app=$app bundle=$bundle"
          # Newest Apple TV 4K simulator on the runner, created if none exists.
          udid="$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("tvOS")) | .value[]
             | select(.name | test("Apple TV 4K"))] | last | .udid // empty')"
          if [ -z "$udid" ]; then
            runtime="$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "tvOS" and .isAvailable)] | last | .identifier')"
            type="$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("Apple TV 4K"))] | last | .identifier')"
            udid="$(xcrun simctl create "Apple TV test" "$type" "$runtime")"
          fi
          xcrun simctl list devices | grep "$udid" || true
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch --terminate-running-process \
            --stdout="$PWD/out/app-stdout.log" --stderr="$PWD/out/app-stderr.log" \
            "$udid" "$bundle"
          for t in 15 45 90; do
            sleep $((t - ${last:-0})); last=$t
            xcrun simctl io "$udid" screenshot "out/screen-${t}s.png"
          done
          # Still running after 90 s, or crashed?
          xcrun simctl spawn "$udid" launchctl list | grep -i "$bundle" > out/still-running.txt || echo "not running" > out/still-running.txt
          xcrun simctl spawn "$udid" log show --last 3m --style compact \
            --predicate 'process == "Runner" OR subsystem == "io.flutter"' > out/app-oslog.log || true
          find ~/Library/Logs/DiagnosticReports -name 'Runner*' -newer "$app" -exec cp {} out/ \; 2>/dev/null || true

      - name: Release device build (unsigned compile check)
        if: always()
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -o pipefail
          flutter-tvos build tvos --release --no-codesign 2>&1 | tee out/build-release.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvos-test
          path: out/
