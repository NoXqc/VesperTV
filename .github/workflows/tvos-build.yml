# Apple TV build (dev-notes/apple-tv.md).
#
# Flutter has no tvOS support; the community flutter-tvos engine and CLI
# (github.com/fluttertv/flutter-tvos) do, pinned below to the release that
# tracks the Flutter version the iPhone build uses. The CLI fetches its own
# pinned Flutter SDK, so no flutter-action here.
#
# What it does:
# - Builds libmpv for Apple TV (tools/tvos/build_mpv_framework.sh, cached)
#   for the media_kit video plugin (third_party/media_kit_video_tvos).
# - Builds the app for the Apple TV simulator and runs it there: a UI tour
#   (lib/services/ci_tour.dart, tools/tvos/sim_tour.sh) with a public channel
#   list; screenshots and the app's log come back as the "tvos-test" artifact.
# - Player smoke test: lib/tvos_player_smoke.dart plays an HLS, a raw .ts and
#   an MKV sample through media_kit on the simulator (screenshots + log).
# - Compiles a release (AOT) device build without signing, to catch what
#   only breaks there. Not installable.
# - By hand with "testflight" ticked: instead of the simulator steps, a signed
#   release archive uploaded to App Store Connect, like the iPhone's
#   (ios-build.yml): same four secrets, Xcode signs through the API key.
#   Apple TV must first be added as a platform on the VesperTV app record in
#   App Store Connect. flutter-tvos signs its engine with an Apple
#   Distribution certificate from a keychain (ITMS-91065 without it:
#   internal TestFlight only): the APPLE_DIST_CERT_P12 / _PASSWORD secrets,
#   imported into a temporary keychain for the upload (2026-11-20).
name: tvOS build

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload to TestFlight (Apple TV)
        type: boolean
        default: false
  push:
    branches: [claude/tvos-test]

env:
  FLUTTER_TVOS_TAG: v3.47.9-tvos.1.11.5
  MPV_FRAMEWORKS: third_party/media_kit_video_tvos/tvos/Frameworks

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out

      - name: Install flutter-tvos
        run: |
          git clone --depth 1 --branch "$FLUTTER_TVOS_TAG" \
            https://github.com/fluttertv/flutter-tvos.git "$RUNNER_TEMP/flutter-tvos"
          echo "$RUNNER_TEMP/flutter-tvos/bin" >> "$GITHUB_PATH"
      - run: flutter-tvos precache
      - run: xcodebuild -version

      - name: Cache Apple TV libmpv
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MPV_FRAMEWORKS }}/Mpv.xcframework
          key: tvos-mpv-${{ hashFiles('tools/tvos/build_mpv_framework.sh') }}
      - name: Build Apple TV libmpv (Mpv.xcframework)
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$MPV_FRAMEWORKS"
          bash tools/tvos/build_mpv_framework.sh "$MPV_FRAMEWORKS" 2>&1 | tee out/mpv-build.log
          rm -rf "$MPV_FRAMEWORKS/.downloads"

      - name: Generate tvos/ when missing
        shell: bash
        run: |
          if [ ! -d tvos ]; then
            # In an existing project this runs Flutter's own create (which
            # keeps every file that exists) and adds tvos/ beside ios/.
            flutter-tvos create --org com.nox . 2>&1 | tee out/create.log
            tar -czf out/tvos-project.tgz tvos
          fi

      # wakelock_plus 1.8+ declares `tvos:` but keeps its tvOS code in ios/;
      # flutter-tvos only builds a plugin's tvos/ folder, so the registrant
      # imported a module that was never built ("Module 'wakelock_plus' not
      # found"). Apple TV uses the fluttertv.dev port (wakelock_plus_tvos)
      # instead: drop upstream's tvOS entry in this runner's pub cache only.
      - name: Use wakelock_plus_tvos, not upstream's tvOS entry
        shell: bash
        run: |
          flutter-tvos pub get
          for f in ~/.pub-cache/hosted/pub.dev/wakelock_plus-*/pubspec.yaml; do
            python3 - "$f" <<'EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          t = re.sub(r"\n      tvos:\n        pluginClass: WakelockPlusPlugin", "", s)
          open(p, "w").write(t)
          print(p, "patched" if t != s else "unchanged")
          EOF
          done

      - name: Build the app for the Apple TV simulator
        if: ${{ !inputs.testflight }}
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          rc=0
          # VESPER_CI_TOUR: the app walks its own screens (lib/services/ci_tour.dart).
          flutter-tvos build tvos --simulator --debug --dart-define=VESPER_CI_TOUR=true -v > out/build-simulator.log 2>&1 || rc=$?
          grep -E "error:|Mpv|Built |BUILD" out/build-simulator.log | tail -40
          exit $rc

      # Screenshots of the real screens (TV guide, a channel playing, full
      # screen, Sports Trak, Settings, Search): out/tour-NN-<stop>.png.
      - name: UI tour on the Apple TV simulator
        if: ${{ !inputs.testflight }}
        run: bash tools/tvos/sim_tour.sh 540

      - name: Build the player smoke test
        if: ${{ always() && !inputs.testflight }}
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -o pipefail
          flutter-tvos build tvos --simulator --debug -t lib/tvos_player_smoke.dart 2>&1 | tee out/build-smoke.log | tail -5

      - name: Run the player smoke test (HLS, .ts, MKV)
        if: ${{ always() && !inputs.testflight }}
        run: bash tools/tvos/sim_run.sh smoke 12 20 37 45 62 70 80

      - name: Release device build (unsigned compile check)
        if: ${{ always() && !inputs.testflight }}
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -o pipefail
          flutter-tvos build tvos --release --no-codesign 2>&1 | tee out/build-release.log | tail -5

      # ---- Signed upload (TestFlight) ----------------------------------------
      # Each upload needs a build number App Store Connect hasn't seen for
      # this version on Apple TV: the +N in pubspec.yaml.
      - name: Signed archive and upload to App Store Connect
        if: ${{ inputs.testflight }}
        shell: bash
        env:
          LANG: en_US.UTF-8
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Apple Distribution certificate (.p12, base64) and its password:
          # flutter-tvos signs the Flutter engine with it (ITMS-91065).
          DIST_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -o pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY TEAM_ID; do
            [ -n "${!v}" ] || { echo "Missing secret for $v (dev-notes/ios.md, TestFlight)"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # The Xcode project builds no Dart: it embeds what the last
          # flutter-tvos build staged in tvos/Flutter, so the release build
          # runs right before the archive (flutter-tvos doc/publish-app.md).
          # The Flutter engine must carry an Apple Distribution signature, or
          # external TestFlight / App Review reject the build (ITMS-91065).
          # flutter-tvos signs it while building when such a certificate is
          # in a keychain: a temporary one, deleted after the upload.
          kc="$RUNNER_TEMP/vesper-signing.keychain-db"
          if [ -n "$DIST_P12" ]; then
            kcpw="$(openssl rand -hex 16)"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
            security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$DIST_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security > /dev/null
            rm -f "$RUNNER_TEMP/dist.p12"
            # The certificate's issuer, for the chain (public, from Apple).
            curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
              -o "$RUNNER_TEMP/wwdr.cer" && security import "$RUNNER_TEMP/wwdr.cer" -k "$kc" > /dev/null || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            # A count only: the identity names the account holder (public log).
            echo "Apple Distribution identities: $(security find-identity -v -p codesigning "$kc" | grep -c 'Apple Distribution')"
          else
            echo "No APPLE_DIST_CERT_P12 secret: the engine stays unsigned (internal TestFlight only)."
          fi
          flutter-tvos build tvos --release --no-codesign 2>&1 | tee out/build-release.log
          grep -q 'no "Apple Distribution" certificate found' out/build-release.log \
            && echo "::warning::Flutter engine embedded unsigned (ITMS-91065: internal TestFlight only)" || true
          # Archived unsigned: automatic signing first makes a development
          # profile, which needs a registered Apple TV ("Your team has no
          # devices", run 43743103746). The export signs it for App Store
          # Connect through the API key (cloud signing), no device needed.
          xcodebuild -workspace tvos/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/VesperTV-tvOS.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            "${auth[@]}" archive > out/archive.log 2>&1 || true
          grep -E "error:|ARCHIVE" out/archive.log || true
          [ -d "$RUNNER_TEMP/VesperTV-tvOS.xcarchive" ] || { tail -60 out/archive.log; exit 1; }
          cp tvos/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          # destination=upload: the export sends the build to App Store Connect.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VesperTV-tvOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" 2>&1 | tee out/export.log
          rm -f "$key"

      - name: Remove the signing keychain
        if: ${{ always() && inputs.testflight }}
        run: security delete-keychain "$RUNNER_TEMP/vesper-signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvos-test
          path: out/
