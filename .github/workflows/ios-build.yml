# iPhone build, two ways:
# - On a push (and by hand): an unsigned VesperTV .ipa as a workflow artifact,
#   for sideloading from Windows with Sideloadly (dev-notes/ios.md).
# - By hand with "testflight" ticked: a signed build uploaded to App Store
#   Connect for TestFlight. Needs four repository secrets (dev-notes/ios.md,
#   TestFlight): APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_API_KEY (the .p8 file's text) and APPLE_TEAM_ID.
#   No Mac needed: Xcode creates the certificate and profile itself through
#   the API key (-allowProvisioningUpdates).
name: iOS build

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload to TestFlight
        type: boolean
        default: false
  push:
    branches: [main, claude/appstore-build]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version
      - run: flutter pub get

      # ---- Unsigned .ipa (sideloading) --------------------------------------
      - name: Build iOS (release, unsigned)
        if: ${{ !inputs.testflight }}
        # CocoaPods is preinstalled on the runner; flutter runs pod install.
        # Release, not debug: a debug build only starts from Xcode.
        run: flutter build ios --release --no-codesign 2>&1 | tee build-ios.log; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          LANG: en_US.UTF-8
      - name: Package the .ipa
        if: ${{ !inputs.testflight }}
        # An .ipa is a zip of Payload/<App>.app; the sideloading tool signs it.
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          mkdir -p Payload
          cp -R build/ios/iphoneos/*.app Payload/
          zip -qry "VesperTV-${version/+/-}-ios-unsigned.ipa" Payload
          ls -l *.ipa
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.testflight }}
        with:
          name: VesperTV-ios
          path: VesperTV-*-ios-unsigned.ipa

      # ---- Signed upload (TestFlight) ----------------------------------------
      # Each upload needs a build number App Store Connect hasn't seen for
      # this version: the +N in pubspec.yaml (bump it like for Android).
      - name: Signed archive and upload to App Store Connect
        if: ${{ inputs.testflight }}
        shell: bash
        env:
          LANG: en_US.UTF-8
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY TEAM_ID; do
            [ -n "${!v}" ] || { echo "Missing secret for $v (dev-notes/ios.md, TestFlight)"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Flutter's generated settings + pod install, without building.
          flutter build ios --release --config-only --no-codesign 2>&1 | tee build-ios.log
          # Archived UNSIGNED, like the Apple TV build (tvos-build.yml): an
          # automatically signed archive made an Apple Development
          # certificate on this throwaway runner every run, and the account
          # hit Apple's certificate limit (TestFlight 969, 2026-11-23). The
          # export signs for App Store Connect through the API key (cloud
          # signing): no certificate here.
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VesperTV.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            "${auth[@]}" archive 2>&1 | tee -a build-ios.log
          [ -d "$RUNNER_TEMP/VesperTV.xcarchive" ] || { tail -60 build-ios.log; exit 1; }
          # Entitlements live in the code signature, so an unsigned archive
          # has none: sign it ad hoc with ios/Runner/Runner.entitlements
          # (iCloud), inside out; the export re-signs and keeps them.
          app="$RUNNER_TEMP/VesperTV.xcarchive/Products/Applications/Runner.app"
          find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
            -exec codesign --force --sign - --timestamp=none {} \;
          for appex in "$app"/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            codesign --force --sign - --timestamp=none "$appex"
          done
          codesign --force --sign - --timestamp=none \
            --entitlements ios/Runner/Runner.entitlements "$app"
          check_entitlements() {
            local bundle="$1" label="$2" got
            got="$(codesign -d --entitlements - --xml "$bundle" 2>/dev/null || codesign -d --entitlements :- "$bundle" 2>/dev/null)"
            for key in $(plutil -convert json -o - ios/Runner/Runner.entitlements | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)))'); do
              if ! printf '%s' "$got" | grep -q "$key"; then
                echo "::error::$label is missing $key"
                return 1
              fi
            done
            echo "$label: entitlements OK"
          }
          check_entitlements "$app" archive-app
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          # A local export first: stop before uploading a build whose
          # signature lost iCloud.
          cp "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/ExportCheck.plist"
          plutil -replace destination -string export "$RUNNER_TEMP/ExportCheck.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VesperTV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportCheck.plist" \
            -exportPath "$RUNNER_TEMP/export-check" \
            "${auth[@]}" >> build-ios.log 2>&1 || { tail -40 build-ios.log; exit 1; }
          ipa="$(find "$RUNNER_TEMP/export-check" -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::the check export made no .ipa"; tail -40 build-ios.log; exit 1; }
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          check_entitlements "$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -1)" export-app
          # destination=upload: the export sends the build to App Store Connect.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VesperTV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" 2>&1 | tee -a build-ios.log
          rm -f "$key"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-ios-log
          path: build-ios.log
