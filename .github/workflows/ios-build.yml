# iPhone/iPad build: an unsigned VesperTV .ipa as a workflow artifact, for
# testing without owning a Mac. Sign and install it from Windows with
# Sideloadly or AltStore and a free Apple ID (the install expires after
# 7 days; reinstall to renew). Steps: dev-notes/ios.md.
#
# Not for the App Store: that needs the paid Apple Developer Program, a
# signed archive and an upload, none of which happens here.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main, claude/appstore-build]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Build iOS (release, unsigned)
        # CocoaPods is preinstalled on the runner; flutter runs pod install.
        # Release, not debug: a debug build only starts from Xcode.
        run: flutter build ios --release --no-codesign 2>&1 | tee build-ios.log; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          LANG: en_US.UTF-8
      - name: Package the .ipa
        # An .ipa is a zip of Payload/<App>.app; the sideloading tool signs it.
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          mkdir -p Payload
          cp -R build/ios/iphoneos/*.app Payload/
          zip -qry "VesperTV-${version/+/-}-ios-unsigned.ipa" Payload
          ls -l *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VesperTV-ios
          path: VesperTV-*-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-ios-log
          path: build-ios.log
