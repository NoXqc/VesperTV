<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Vesper AI</title>
<style>
  :root { --gold: #d4af37; --bg: #050505; --card: #111; --text: #f2f2f2; --dim: #9a9a9a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { margin: 4px 0 2px; font-size: 22px; color: var(--gold); letter-spacing: .5px; }
  h1 span { font-size: 18px; }
  p.sub { margin: 0 0 18px; color: var(--dim); font-size: 14px; }
  #mic { display: none; width: 132px; height: 132px; margin: 8px auto 18px; border-radius: 50%;
    border: 2px solid var(--gold); background: radial-gradient(circle, #3a2f0c, #000 70%);
    color: var(--gold); font-size: 15px; font-weight: 600; cursor: pointer; }
  #mic.on { box-shadow: 0 0 0 8px rgba(212,175,55,.25), 0 0 36px rgba(212,175,55,.6); color: #fff; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 14px 14px; border-radius: 12px; border: 1px solid #333;
    background: var(--card); color: var(--text); font-size: 17px; }
  input:focus { outline: 2px solid var(--gold); border-color: transparent; }
  button.send { padding: 0 18px; border-radius: 12px; border: 0; background: var(--gold); color: #000;
    font-weight: 700; font-size: 16px; }
  .hint { color: var(--dim); font-size: 13px; margin: 8px 2px 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chips button { padding: 9px 14px; border-radius: 999px; border: 1px solid #3a3a3a;
    background: var(--card); color: var(--text); font-size: 14px; }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .me { align-self: flex-end; background: #2a230a; border: 1px solid #5a4a14; }
  .ai { align-self: flex-start; background: var(--card); border: 1px solid #2a2a2a; }
  .me, .ai { padding: 10px 14px; border-radius: 14px; max-width: 88%; white-space: pre-wrap; }
  .err { color: #ff8a80; }
</style>
</head>
<body>
<main>
  <h1><span>&#10022;</span> Vesper AI</h1>
  <p class="sub" id="sub">Talk to VesperTV on your TV.</p>
  <button id="mic" type="button">Hold to talk</button>
  <form id="form" autocomplete="off">
    <input id="text" type="text" enterkeyhint="send" placeholder="Play TSN 1">
    <button class="send" type="submit" id="send">Send</button>
  </form>
  <div class="hint" id="hint">Tip: tap the microphone on your phone's keyboard to talk.</div>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
</main>
<script>
(function () {
  // Same page on the TV's own Wi-Fi server (POST ./say) and on the relay
  // (https://pair.vespertv.app/ai#<link>: JSON-RPC "vesper/say" through the
  // TV's AI link). The relay link never leaves this page except to the relay.
  var T = {
    en: { sub: "Talk to VesperTV on your TV.", mic: "Hold to talk", listening: "Listening…",
      send: "Send", hint: "Tip: tap the microphone on your phone's keyboard to talk.",
      off: "The TV did not answer. Is VesperTV open?", busy: "One moment…",
      chips: ["What's on", "Pause", "Resume", "Next channel", "Go back 30 seconds", "Back to live"] },
    fr: { sub: "Parlez à VesperTV sur votre télé.", mic: "Maintenir pour parler", listening: "J'écoute…",
      send: "Envoyer", hint: "Astuce : touchez le micro du clavier de votre téléphone pour parler.",
      off: "La télé n'a pas répondu. VesperTV est-il ouvert ?", busy: "Un instant…",
      chips: ["Qu'est-ce qui joue", "Pause", "Reprends", "Chaîne suivante", "Recule de 30 secondes", "Retour au direct"] },
    es: { sub: "Habla con VesperTV en tu tele.", mic: "Mantén para hablar", listening: "Escuchando…",
      send: "Enviar", hint: "Consejo: toca el micrófono del teclado de tu teléfono para hablar.",
      off: "La tele no respondió. ¿Está VesperTV abierto?", busy: "Un momento…",
      chips: ["Qué es esto", "Pausa", "Sigue", "Canal siguiente", "Retrocede 30 segundos", "En directo"] },
    it: { sub: "Parla con VesperTV sulla tua TV.", mic: "Tieni premuto per parlare", listening: "Ascolto…",
      send: "Invia", hint: "Suggerimento: tocca il microfono della tastiera del telefono per parlare.",
      off: "La TV non ha risposto. VesperTV è aperto?", busy: "Un attimo…",
      chips: ["Cos'è questo", "Pausa", "Riprendi", "Canale successivo", "Indietro 30 secondi", "In diretta"] },
    de: { sub: "Sprich mit VesperTV auf deinem Fernseher.", mic: "Halten zum Sprechen", listening: "Ich höre…",
      send: "Senden", hint: "Tipp: Tippe auf das Mikrofon der Handytastatur, um zu sprechen.",
      off: "Der Fernseher antwortet nicht. Ist VesperTV offen?", busy: "Einen Moment…",
      chips: ["Was läuft", "Pausieren", "Weiter", "Nächster Sender", "Zurück 30 Sekunden", "Zurück zu live"] },
    el: { sub: "Μίλα στο VesperTV στην τηλεόρασή σου.", mic: "Κράτα για να μιλήσεις", listening: "Ακούω…",
      send: "Αποστολή", hint: "Συμβουλή: πάτα το μικρόφωνο του πληκτρολογίου του κινητού σου.",
      off: "Η τηλεόραση δεν απάντησε. Είναι ανοιχτό το VesperTV;", busy: "Μια στιγμή…",
      chips: ["What's on", "Pause", "Resume", "Next channel", "Go back 30 seconds", "Back to live"] }
  };
  var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
  var t = T[lang] || T.en;
  var $ = function (id) { return document.getElementById(id); };
  $("sub").textContent = t.sub; $("mic").textContent = t.mic;
  $("send").textContent = t.send; $("hint").textContent = t.hint;
  document.documentElement.lang = lang;

  var link = location.hash.length > 1 ? location.hash.slice(1) : null;
  var busy = false;

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = cls; d.textContent = text;
    $("log").insertBefore(d, $("log").firstChild);
    return d;
  }

  function say(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true;
    add("me", text);
    var pending = add("ai", t.busy);
    var req;
    if (link) {
      req = fetch("/mcp/" + encodeURIComponent(link), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "vesper/say",
          params: { text: text, lang: lang } })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.error) throw new Error(j.error.message || "error");
        return (j.result && j.result.reply) || "";
      });
    } else {
      req = fetch(location.pathname.replace(/\/$/, "") + "/say", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, lang: lang })
      }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function (j) { return j.reply || ""; });
    }
    req.then(function (reply) {
      pending.textContent = reply || "✓";
    }).catch(function () {
      pending.textContent = t.off; pending.classList.add("err");
    }).then(function () { busy = false; });
  }

  t.chips.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = c;
    b.onclick = function () { say(c); };
    $("chips").appendChild(b);
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("text").value; $("text").value = "";
    say(v);
  });

  // The browser's own speech recognition: only on a secure page (the relay).
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR && window.isSecureContext) {
    var mic = $("mic"); mic.style.display = "block";
    $("hint").style.display = "none";
    var rec = null, heard = "";
    var startRec = function (e) {
      if (e) e.preventDefault();
      if (rec) return;
      heard = "";
      rec = new SR();
      rec.lang = navigator.language || "en-US";
      rec.interimResults = true;
      rec.onresult = function (ev) {
        heard = "";
        for (var i = 0; i < ev.results.length; i++) heard += ev.results[i][0].transcript;
        $("text").value = heard;
      };
      rec.onend = function () {
        mic.classList.remove("on"); mic.textContent = t.mic; rec = null;
        if (heard.trim()) { $("text").value = ""; say(heard); }
      };
      rec.onerror = function () { mic.classList.remove("on"); };
      mic.classList.add("on"); mic.textContent = t.listening;
      rec.start();
    };
    var stopRec = function () { if (rec) rec.stop(); };
    mic.addEventListener("pointerdown", startRec);
    mic.addEventListener("pointerup", stopRec);
    mic.addEventListener("pointerleave", stopRec);
  }
})();
</script>
</body>
</html>
